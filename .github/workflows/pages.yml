# Legger innholdet i mappen nettsted ut som GitHub Pages-side ved hver push til main.
# Samme mønster som easysalon-sales, men uten byggesteg, siden siden er ren HTML.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # GitHub Pages lar nettleseren beholde filene i ti minutter, og det kan ikke endres.
      # Derfor får stilarket og skriptet en ny adresse ved hver publisering, slik at
      # nettleseren henter dem på nytt så snart den har fått den nye siden.
      - name: Merk stilark og skript med versjon
        run: |
          versjon="${GITHUB_SHA::8}"
          sed -i "s|href=\"stil.css\"|href=\"stil.css?v=${versjon}\"|; s|src=\"skjema.js\"|src=\"skjema.js?v=${versjon}\"|; s|src=\"maling.js\"|src=\"maling.js?v=${versjon}\"|; s|src=\"kart.js\"|src=\"kart.js?v=${versjon}\"|" nettsted/*.html
          grep -c "?v=${versjon}" nettsted/*.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: nettsted
      # Publiseringen har flere ganger feilet fordi den spør etter pakken under ett sekund
      # etter opplastingen, før GitHub har rukket å registrere den. Derfor en kort pause.
      - name: Vent til pakken er registrert
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
